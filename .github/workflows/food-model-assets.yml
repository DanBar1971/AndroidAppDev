name: SaúdePrática — Preparar modelo alimentar
on:
  push:
    paths:
      - ".github/workflows/food-model-assets.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-food-model:
    runs-on: ubuntu-latest
    steps:
      - name: Transferir modelo alimentar Google AIY (Apache-2.0)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p food-model
          curl -fL --retry 3 --connect-timeout 20 --max-time 180             'https://www.kaggle.com/api/v1/models/google/aiy/tfLite/vision-classifier-food-v1/1/download'             -o food-model/food_v1.download
          curl -fL --retry 3 --connect-timeout 20 --max-time 60             'https://www.gstatic.com/aihub/tfhub/labelmaps/aiy_food_V1_labelmap.csv'             -o food-model/labels.csv
          file food-model/food_v1.download
          ls -lh food-model
          test "$(stat -c%s food-model/food_v1.download)" -gt 1000000
          if unzip -t food-model/food_v1.download >/dev/null 2>&1; then unzip -l food-model/food_v1.download | head -40; mv food-model/food_v1.download food-model/food_v1.zip; else mv food-model/food_v1.download food-model/food_v1.tflite; fi
          test "$(wc -l < food-model/labels.csv)" -gt 1900
          find food-model -maxdepth 1 -type f -printf '%p %s bytes\n'
          head -n 5 food-model/labels.csv
          sha256sum food-model/*
      - name: Preparar Python 3.11 para testar TFLite
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar execução real do classificador offline
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'tflite-runtime==2.14.0' 'numpy==1.26.4'
          python - <<'PY'
          import tarfile,numpy as np
          from tflite_runtime.interpreter import Interpreter
          with tarfile.open('food-model/food_v1.tflite') as archive:
              data=archive.extractfile('1.tflite').read()
          with open('/tmp/food_v1.tflite','wb') as f: f.write(data)
          model=Interpreter(model_path='/tmp/food_v1.tflite',num_threads=2)
          model.allocate_tensors()
          inp=model.get_input_details()[0];out=model.get_output_details()[0]
          print('MODEL INPUT',inp['shape'],inp['dtype'])
          print('MODEL OUTPUT',out['shape'],out['dtype'])
          assert int(np.prod(inp['shape']))>=3*100*100
          assert out['shape'][-1]==2024
          fake=np.zeros(inp['shape'],dtype=inp['dtype'])
          model.set_tensor(inp['index'],fake)
          model.invoke()
          result=model.get_tensor(out['index'])
          assert np.all(np.isfinite(result))
          print('OFFLINE INFERENCE PASSED top=',np.argsort(result.flatten())[-5:])
          PY
      - name: Carregar artefacto de modelo para integração Android
        uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-food-model-offline
          path: food-model/
          retention-days: 14
