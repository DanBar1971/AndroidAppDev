name: MediAgenda Android Build

on:
  push:
    branches: [master]
    paths:
      - "MediAgenda/**"
      - ".github/workflows/mediagenda-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct MediAgenda base source
        run: |
          mkdir -p build-src
          cat MediAgenda/source/v11_*.b64 > build-src/MediAgenda-v1.1.zip.b64
          base64 -d build-src/MediAgenda-v1.1.zip.b64 > build-src/MediAgenda-v1.1.zip
          echo "e4aad8173353eb61e1f776a58c2a18d0cb6fdd9197f3c8f0c8856e9575357253  build-src/MediAgenda-v1.1.zip" | sha256sum -c -
          unzip -q build-src/MediAgenda-v1.1.zip -d build-src

      - name: Apply MediAgenda v1.2 OCR fixes
        shell: bash
        run: |
          ROOT="build-src/MediAgenda_Android_v1"
          cp MediAgenda/v12_overrides/PrescriptionOcrParser.kt "$ROOT/app/src/main/java/com/mediagenda/app/ocr/PrescriptionOcrParser.kt"
          cp MediAgenda/v12_overrides/AppointmentOcrParser.kt "$ROOT/app/src/main/java/com/mediagenda/app/ocr/AppointmentOcrParser.kt"

          python3 - <<'PY'
          from pathlib import Path
          root = Path("build-src/MediAgenda_Android_v1")

          # Model: keep prescription number and add prescription date separately.
          p = root / "app/src/main/java/com/mediagenda/app/model/Models.kt"
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '    var prescriptionCode: String = "",\n    var dispenseCode: String = "",',
              '    var prescriptionCode: String = "",\n    var prescriptionDate: String = "",\n    var dispenseCode: String = "",'
          )
          p.write_text(s, encoding="utf-8")

          # JSON + CSV compatibility.
          p = root / "app/src/main/java/com/mediagenda/app/data/DataRepository.kt"
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '                prescriptionCode = o.optString("prescription_code"),\n                dispenseCode = o.optString("dispense_code"),',
              '                prescriptionCode = o.optString("prescription_code"),\n                prescriptionDate = o.optString("prescription_date"),\n                dispenseCode = o.optString("dispense_code"),'
          )
          s = s.replace(
              '                .put("prescription_code", m.prescriptionCode)\n                .put("dispense_code", m.dispenseCode)',
              '                .put("prescription_code", m.prescriptionCode)\n                .put("prescription_date", m.prescriptionDate)\n                .put("dispense_code", m.dispenseCode)'
          )
          s = s.replace(
              'N.º Prescrição;Código Acesso/Dispensa;Código Opção;Validade;Código Lido;Datas',
              'N.º Prescrição;Data Prescrição;Código Acesso/Dispensa;Código Opção;Validade;Código Lido;Datas'
          )
          s = s.replace(
              'm.prescriptionCode,m.dispenseCode,m.optionCode,m.validUntil,m.sourceBarcode,dates',
              'm.prescriptionCode,m.prescriptionDate,m.dispenseCode,m.optionCode,m.validUntil,m.sourceBarcode,dates'
          )
          p.write_text(s, encoding="utf-8")

          # Dependencies/version.
          p = root / "app/build.gradle.kts"
          s = p.read_text(encoding="utf-8")
          s = s.replace('versionCode = 2', 'versionCode = 3')
          s = s.replace('versionName = "1.1.0"', 'versionName = "1.2.0"')
          s = s.replace('com.google.android.gms:play-services-location:21.4.0',
                        'com.google.android.gms:play-services-location:21.3.0')
          if 'com.google.mlkit:barcode-scanning' not in s:
              s = s.replace(
                  '    implementation("com.google.mlkit:text-recognition:16.0.1")\n',
                  '    implementation("com.google.mlkit:text-recognition:16.0.1")\n    implementation("com.google.mlkit:barcode-scanning:17.3.0")\n'
              )
          p.write_text(s, encoding="utf-8")

          # Main UI: scan the barcodes in the full-page prescription photo too.
          p = root / "app/src/main/java/com/mediagenda/app/MainActivity.kt"
          s = p.read_text(encoding="utf-8")
          s = s.replace('private val background = Color.parseColor("#F4F7F9")',
                        'private val appBackground = Color.parseColor("#F4F7F9")')
          s = s.replace('setBackgroundColor(background)', 'setBackgroundColor(appBackground)')
          s = s.replace('private val text = Color.parseColor("#132238")',
                        'private val mainTextColor = Color.parseColor("#132238")')
          s = s.replace('setTextColor(text)', 'setTextColor(mainTextColor)')

          if 'import com.google.mlkit.vision.barcode.BarcodeScanning' not in s:
              s = s.replace(
                  'import com.google.mlkit.vision.common.InputImage\n',
                  'import com.google.mlkit.vision.common.InputImage\nimport com.google.mlkit.vision.barcode.BarcodeScanning\n'
              )

          old = '''    private fun recognizePrescription(uri: Uri) {
        val input = InputImage.fromFilePath(this, uri)
        TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS).process(input)
            .addOnSuccessListener { vision ->
                val med = PrescriptionOcrParser.parse(vision.text, pendingPrescriptionScan)
                pendingPrescriptionScan = ""
                editMedication(null, med, true)
            }
            .addOnFailureListener {
                showError("Não foi possível reconhecer a guia. Pode repetir a fotografia ou adicionar a medicação manualmente.")
            }
    }
'''
          new = '''    private fun recognizePrescription(uri: Uri) {
        val input = InputImage.fromFilePath(this, uri)
        TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS).process(input)
            .addOnSuccessListener { vision ->
                BarcodeScanning.getClient().process(input)
                    .addOnSuccessListener { barcodes ->
                        val photoCodes = barcodes.mapNotNull { it.rawValue }.filter { it.isNotBlank() }.joinToString("\\n")
                        val combinedCodes = listOf(pendingPrescriptionScan, photoCodes).filter { it.isNotBlank() }.joinToString("\\n")
                        val med = PrescriptionOcrParser.parse(vision.text, combinedCodes)
                        pendingPrescriptionScan = ""
                        editMedication(null, med, true)
                    }
                    .addOnFailureListener {
                        val med = PrescriptionOcrParser.parse(vision.text, pendingPrescriptionScan)
                        pendingPrescriptionScan = ""
                        editMedication(null, med, true)
                    }
            }
            .addOnFailureListener {
                showError("Não foi possível reconhecer a guia. Tente fotografar a folha inteira, direita e com boa luz.")
            }
    }
'''
          if old not in s:
              raise SystemExit("recognizePrescription block not found")
          s = s.replace(old, new, 1)

          s = s.replace(
              '        val prescription = input("N.º da prescrição", m.prescriptionCode)\n        val dispense = input("Código de acesso e dispensa", m.dispenseCode)',
              '        val prescription = input("N.º da prescrição", m.prescriptionCode)\n        val prescriptionDate = input("Data da prescrição (YYYY-MM-DD)", m.prescriptionDate)\n        val dispense = input("Código de acesso e dispensa", m.dispenseCode)'
          )
          s = s.replace(
              'listOf(name,dose,indication,timeText,reminder,prescription,dispense,option,validUntil,dates)',
              'listOf(name,dose,indication,timeText,reminder,prescription,prescriptionDate,dispense,option,validUntil,dates)'
          )
          s = s.replace(
              'm.reminderTime=reminder.edit.text.toString().trim(); m.prescriptionCode=prescription.edit.text.toString().trim()\n                m.dispenseCode=dispense.edit.text.toString().trim();',
              'm.reminderTime=reminder.edit.text.toString().trim(); m.prescriptionCode=prescription.edit.text.toString().trim()\n                m.prescriptionDate=prescriptionDate.edit.text.toString().trim(); m.dispenseCode=dispense.edit.text.toString().trim();'
          )
          s = s.replace(
              'h.code.text=when{m.prescriptionCode.isNotBlank()->"Prescrição ${m.prescriptionCode}";m.dispenseCode.isNotBlank()->"Código de dispensa ${m.dispenseCode}";else->""}',
              'h.code.text=when{m.prescriptionCode.isNotBlank()->"Prescrição ${m.prescriptionCode}" + if(m.validUntil.isNotBlank()) "  •  válida até ${m.validUntil}" else "";m.dispenseCode.isNotBlank()->"Código de dispensa ${m.dispenseCode}";else->""}'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build APK
        working-directory: build-src/MediAgenda_Android_v1
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp build-src/MediAgenda_Android_v1/app/build/outputs/apk/debug/app-debug.apk MediAgenda-v1.2-debug.apk
          ls -lh MediAgenda-v1.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediAgenda-v1.2-debug
          path: MediAgenda-v1.2-debug.apk
          if-no-files-found: error
          retention-days: 30
