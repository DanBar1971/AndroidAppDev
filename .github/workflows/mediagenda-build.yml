name: MediAgenda Android Build

on:
  push:
    branches: [master]
    paths:
      - "MediAgenda/**"
      - ".github/workflows/mediagenda-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct MediAgenda v1.1 source
        run: |
          mkdir -p build-src
          cat MediAgenda/source/v11_*.b64 > build-src/MediAgenda-v1.1.zip.b64
          base64 -d build-src/MediAgenda-v1.1.zip.b64 > build-src/MediAgenda-v1.1.zip
          echo "e4aad8173353eb61e1f776a58c2a18d0cb6fdd9197f3c8f0c8856e9575357253  build-src/MediAgenda-v1.1.zip" | sha256sum -c -
          unzip -q build-src/MediAgenda-v1.1.zip -d build-src

      - name: Apply v1.1 compile fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build-src/MediAgenda_Android_v1")
          gradle = root / "app/build.gradle.kts"
          s = gradle.read_text(encoding="utf-8").replace(
              'com.google.android.gms:play-services-location:21.4.0',
              'com.google.android.gms:play-services-location:21.3.0'
          )
          gradle.write_text(s, encoding="utf-8")

          p = root / "app/src/main/java/com/mediagenda/app/MainActivity.kt"
          s = p.read_text(encoding="utf-8")
          s = s.replace('private val background = Color.parseColor("#F4F7F9")',
                        'private val appBackground = Color.parseColor("#F4F7F9")')
          s = s.replace('setBackgroundColor(background)', 'setBackgroundColor(appBackground)')
          s = s.replace('private val text = Color.parseColor("#132238")',
                        'private val mainTextColor = Color.parseColor("#132238")')
          s = s.replace('setTextColor(text)', 'setTextColor(mainTextColor)')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build APK
        working-directory: build-src/MediAgenda_Android_v1
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp build-src/MediAgenda_Android_v1/app/build/outputs/apk/debug/app-debug.apk MediAgenda-v1.1-debug.apk
          ls -lh MediAgenda-v1.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediAgenda-v1.1-debug
          path: MediAgenda-v1.1-debug.apk
          if-no-files-found: error
          retention-days: 30
