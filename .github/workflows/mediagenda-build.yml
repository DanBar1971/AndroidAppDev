name: MediAgenda Android Build

on:
  push:
    branches: [master]
    paths:
      - "MediAgenda/**"
      - ".github/workflows/mediagenda-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct MediAgenda base
        run: |
          mkdir -p build-src
          cat MediAgenda/source/v11_*.b64 > build-src/MediAgenda-v1.1.zip.b64
          base64 -d build-src/MediAgenda-v1.1.zip.b64 > build-src/MediAgenda-v1.1.zip
          echo "e4aad8173353eb61e1f776a58c2a18d0cb6fdd9197f3c8f0c8856e9575357253  build-src/MediAgenda-v1.1.zip" | sha256sum -c -
          unzip -q build-src/MediAgenda-v1.1.zip -d build-src

      - name: Apply v1.2 source
        run: |
          ROOT="build-src/MediAgenda_Android_v1"
          cp MediAgenda/v12_overrides/PrescriptionOcrParser.kt "$ROOT/app/src/main/java/com/mediagenda/app/ocr/PrescriptionOcrParser.kt"
          cp MediAgenda/v12_overrides/AppointmentOcrParser.kt "$ROOT/app/src/main/java/com/mediagenda/app/ocr/AppointmentOcrParser.kt"
          python3 MediAgenda/v12_overrides/apply_v12.py

      - name: Apply v1.3 medication box recognition
        run: |
          ROOT="build-src/MediAgenda_Android_v1"
          cp MediAgenda/v13_overrides/MedicationBoxOcrParser.kt "$ROOT/app/src/main/java/com/mediagenda/app/ocr/MedicationBoxOcrParser.kt"
          python3 MediAgenda/v13_overrides/apply_v13.py

      - name: Build APK
        working-directory: build-src/MediAgenda_Android_v1
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp build-src/MediAgenda_Android_v1/app/build/outputs/apk/debug/app-debug.apk MediAgenda-v1.3-debug.apk
          ls -lh MediAgenda-v1.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediAgenda-v1.3-debug
          path: MediAgenda-v1.3-debug.apk
          if-no-files-found: error
          retention-days: 30
