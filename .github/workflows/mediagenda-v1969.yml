name: SaudePratica v1.9.79 Android Build
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/mediagenda-v1969.yml"
      - "MediAgenda/v87_overrides/**"
      - "MediAgenda/v88_overrides/**"
      - "MediAgenda/v89_overrides/**"
      - "MediAgenda/v90_overrides/**"
      - "MediAgenda/v91_overrides/**"
      - "MediAgenda/v92_overrides/**"
      - "MediAgenda/v93_overrides/**"
      - "MediAgenda/v94_overrides/**"
      - "MediAgenda/v95_overrides/**"
      - "MediAgenda/v96_overrides/**"
      - "MediAgenda/v97_overrides/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/mediagenda-v1969.yml"
      - "MediAgenda/v87_overrides/**"
      - "MediAgenda/v88_overrides/**"
      - "MediAgenda/v89_overrides/**"
      - "MediAgenda/v90_overrides/**"
      - "MediAgenda/v91_overrides/**"
      - "MediAgenda/v92_overrides/**"
      - "MediAgenda/v93_overrides/**"
      - "MediAgenda/v94_overrides/**"
      - "MediAgenda/v95_overrides/**"
      - "MediAgenda/v96_overrides/**"
      - "MediAgenda/v97_overrides/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Reconstruct previous versions and apply v1.9.79
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess,yaml
          workflow=yaml.safe_load(open(".github/workflows/mediagenda-build.yml"))
          steps=workflow["jobs"]["build"]["steps"]
          started=False
          for step in steps:
              name=step.get("name","")
              if name=="Reconstruct MediAgenda base":started=True
              if not started:continue
              if name=="Flag missing artwork in intermediate APK":break
              script=step.get("run")
              if script:
                  print("Applying:",name,flush=True)
                  subprocess.run(["bash","-eo","pipefail","-c",script],check=True)
          subprocess.run(["python3","MediAgenda/v87_overrides/apply_v87.py"],check=True)
          subprocess.run(["python3","MediAgenda/v89_overrides/apply_v89.py"],check=True)
          subprocess.run(["python3","MediAgenda/v90_overrides/apply_v90.py"],check=True)
          subprocess.run(["python3","MediAgenda/v91_overrides/apply_v91.py"],check=True)
          subprocess.run(["python3","MediAgenda/v92_overrides/apply_v92.py"],check=True)
          subprocess.run(["python3","MediAgenda/v93_overrides/apply_v93.py"],check=True)
          subprocess.run(["python3","MediAgenda/v94_overrides/apply_v94.py"],check=True)
          subprocess.run(["python3","MediAgenda/v95_overrides/apply_v95.py"],check=True)
          subprocess.run(["python3","MediAgenda/v96_overrides/apply_v96.py"],check=True)
          subprocess.run(["python3","MediAgenda/v97_overrides/apply_v97.py"],check=True)
          PY
      - name: Compile Android 1.9.79
        working-directory: build-src/MediAgenda_Android_v1
        run: gradle --no-daemon assembleRelease
      - name: Check output version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk | head -n 3
          grep -F 'versionName = "1.9.79"' build-src/MediAgenda_Android_v1/app/build.gradle.kts
      - name: Sign release APK with existing key when available
        env:
          KEY_B64: ${{ secrets.SAUDEPRATICA_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.SAUDEPRATICA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAUDEPRATICA_KEY_ALIAS }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "No signing key available; signed APK will not be published."
            exit 0
          fi
          if ! python3 MediAgenda/tools/verify_graphics.py; then
            echo "Original graphics missing; refusing to publish a signed APK."
            exit 0
          fi
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/saudepratica.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/saudepratica.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_PASS --key-pass env:KEY_PASS \
            --out SaudePratica-v1.9.79-SIGNED.apk \
            build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose SaudePratica-v1.9.79-SIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-v1.9.79-SIGNED
          path: SaudePratica-v1.9.79-SIGNED.apk
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-v1.9.79-FULL-SOURCE
          path: build-src/MediAgenda_Android_v1/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-v1.9.79-UNSIGNED
          path: build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

      - name: Verify original signing identity and publish v1.9.79 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s SaudePratica-v1.9.79-SIGNED.apk ]; then
            echo "::warning::Release NOT published: original Android signing key is unavailable."
            exit 0
          fi
          SDK_APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v1.9.78/SaudePratica.apk" \
            -o "$RUNNER_TEMP/stable-v1.9.78.apk"
          PREVIOUS="$("$SDK_APKSIGNER" verify --print-certs "$RUNNER_TEMP/stable-v1.9.78.apk" |
            grep 'Signer #1 certificate SHA-256 digest:' | head -1 | awk '{print $NF}')"
          CANDIDATE="$("$SDK_APKSIGNER" verify --print-certs SaudePratica-v1.9.79-SIGNED.apk |
            grep 'Signer #1 certificate SHA-256 digest:' | head -1 | awk '{print $NF}')"
          if [ -z "$PREVIOUS" ] || [ "$PREVIOUS" != "$CANDIDATE" ]; then
            echo "::error::Certificate differs from installed app; refusing public update."
            exit 1
          fi
          if gh release view v1.9.79 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 0
          fi
          cp SaudePratica-v1.9.79-SIGNED.apk SaudePratica.apk
          gh release create v1.9.79 SaudePratica.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SaúdePrática v1.9.79 — Lares e Apoio à Terceira Idade" \
            --notes "Novo módulo de Lares com ERPI, Apoio Domiciliário, Centro de Dia, instituição e contactos, mensalidades ADSE e PDFs em Documentos Digitais. Envio e estados ADSE dependem de confirmação manual; não há submissão automática. Instalar sobre a versão anterior, com a mesma assinatura e sem apagar dados." \
            --latest
          gh release view v1.9.79 --repo "$GITHUB_REPOSITORY"
