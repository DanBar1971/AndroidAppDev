  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Reconstruct previous versions and apply v1.9.98
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess,yaml
          workflow=yaml.safe_load(open(".github/workflows/mediagenda-build.yml"))
          steps=workflow["jobs"]["build"]["steps"]
          started=False
          for step in steps:
              name=step.get("name","")
              if name=="Reconstruct MediAgenda base":started=True
              if not started:continue
              if name=="Flag missing artwork in intermediate APK":break
              script=step.get("run")
              if script:
                  print("Applying:",name,flush=True)
                  subprocess.run(["bash","-eo","pipefail","-c",script],check=True)
          subprocess.run(["python3","MediAgenda/v87_overrides/apply_v87.py"],check=True)
          subprocess.run(["python3","MediAgenda/v89_overrides/apply_v89.py"],check=True)
          subprocess.run(["python3","MediAgenda/v90_overrides/apply_v90.py"],check=True)
          subprocess.run(["python3","MediAgenda/v91_overrides/apply_v91.py"],check=True)
          subprocess.run(["python3","MediAgenda/v92_overrides/apply_v92.py"],check=True)
          subprocess.run(["python3","MediAgenda/v93_overrides/apply_v93.py"],check=True)
          subprocess.run(["python3","MediAgenda/v94_overrides/apply_v94.py"],check=True)
          subprocess.run(["python3","MediAgenda/v95_overrides/apply_v95.py"],check=True)
          subprocess.run(["python3","MediAgenda/v96_overrides/apply_v96.py"],check=True)
          subprocess.run(["python3","MediAgenda/v97_overrides/apply_v97.py"],check=True)
          subprocess.run(["python3","MediAgenda/v98_overrides/apply_v98.py"],check=True)
          subprocess.run(["python3","MediAgenda/v99_overrides/apply_v99.py"],check=True)
          subprocess.run(["python3","MediAgenda/v100_overrides/apply_v100.py"],check=True)
          subprocess.run(["python3","MediAgenda/v101_overrides/apply_v101.py"],check=True)
          subprocess.run(["python3","MediAgenda/v102_overrides/apply_v102.py"],check=True)
          subprocess.run(["python3","MediAgenda/v103_overrides/apply_v103.py"],check=True)
          subprocess.run(["python3","MediAgenda/v104_overrides/apply_v104.py"],check=True)
          subprocess.run(["python3","MediAgenda/v104_overrides/apply_v104_group_snooze.py"],check=True)
          subprocess.run(["python3","MediAgenda/v104_overrides/apply_v104_updater.py"],check=True)
          subprocess.run(["python3","MediAgenda/v105_overrides/apply_v105.py"],check=True)
          subprocess.run(["python3","MediAgenda/v105_overrides/apply_v105_lockscreen.py"],check=True)
          subprocess.run(["python3","MediAgenda/v106_overrides/apply_v106.py"],check=True)
          subprocess.run(["python3","MediAgenda/v107_overrides/apply_v107.py"],check=True)
          subprocess.run(["python3","MediAgenda/v108_overrides/apply_v108.py"],check=True)
          subprocess.run(["python3","MediAgenda/v109_overrides/apply_v109.py"],check=True)
          subprocess.run(["python3","MediAgenda/v110_overrides/apply_v110.py"],check=True)
          subprocess.run(["python3","MediAgenda/v111_overrides/apply_v111.py"],check=True)
          subprocess.run(["python3","MediAgenda/v112_overrides/apply_v112.py"],check=True)
          subprocess.run(["python3","MediAgenda/v113_overrides/apply_v113.py"],check=True)
          subprocess.run(["python3","MediAgenda/v113_overrides/apply_v113_catalog.py"],check=True)
          subprocess.run(["python3","MediAgenda/v114_overrides/apply_v114.py"],check=True)
          subprocess.run(["python3","MediAgenda/v115_overrides/apply_v115.py"],check=True)
          subprocess.run(["python3","MediAgenda/v116_overrides/apply_v116.py"],check=True)
          subprocess.run(["python3","MediAgenda/v117_overrides/apply_v117.py"],check=True)
          PY
      - name: Verify Fase A safe identity invariants
        run: python3 MediAgenda/v110_overrides/verify_identity.py
      - name: Verify Fase B alarm and patient routing invariants
        run: python3 MediAgenda/v111_overrides/verify_phase_b.py
      - name: Verify Fase C nutrition, barcode, photos and privacy
        run: python3 MediAgenda/v112_overrides/verify_phase_c.py
      - name: Verify Fase D original document and clinic safety gates
        run: python3 MediAgenda/v113_overrides/verify_phase_d.py
      - name: Verify Gemini nutrition UX hotfix and original images
        run: python3 MediAgenda/v114_overrides/verify_nutrition_hotfix.py
      - name: Verify Phase E Health Connect, hydration and visible Phase D access
        run: python3 MediAgenda/v115_overrides/verify_phase_e.py
      - name: Verify Gemini retry and exact alarm diagnostics (TOMEI unchanged)
        run: python3 MediAgenda/v116_overrides/verify_v116.py
      - name: Verify nutrition review, permanent Save and original photo
        run: python3 MediAgenda/v117_overrides/verify_v117.py
      - name: Apply v1.9.99 Gemini stable model fallback
        run: python3 MediAgenda/v118_overrides/apply_v118.py
      - name: Verify 429/503 diagnostics and 1.9.99 compatibility
        run: python3 MediAgenda/v118_overrides/verify_v118.py
      - name: Apply v1.9.100 fullscreen medication alarm fixes
        run: python3 MediAgenda/v119_overrides/apply_v119.py
      - name: Verify v1.9.100 full-screen, TOMEI, snooze and missed doses
        run: python3 MediAgenda/v119_overrides/verify_v119.py
      - name: Require original app artwork (background, icon and splash)
        run: python3 MediAgenda/tools/verify_graphics.py
      - name: Compile Android 1.9.100
        working-directory: build-src/MediAgenda_Android_v1
        run: gradle --no-daemon assembleRelease
      - name: Check branded graphics exist inside compiled APK
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          apk="build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk"
          with ZipFile(apk) as z:
              branded=[(a.filename,a.file_size) for a in z.infolist()
                       if a.filename.startswith("res/") and
                          a.filename.lower().endswith(".png") and a.file_size>50000]
          if len(branded)<3:
              raise SystemExit("App artwork missing from APK; blocking this release: "+repr(branded))
          print("Branded graphics packaged:",branded)
          PY
      - name: Check output version
        run: |
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='com.mediagenda.app.stable'"
          echo "$BADGING" | grep -F "versionCode='110'"
          echo "$BADGING" | grep -F "versionName='1.9.100'"
          grep -F 'versionCode = 110' build-src/MediAgenda_Android_v1/app/build.gradle.kts
          grep -F 'versionName = "1.9.100"' build-src/MediAgenda_Android_v1/app/build.gradle.kts
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-v1.9.100-FULL-SOURCE
          path: build-src/MediAgenda_Android_v1/
          retention-days: 7
      - name: Export Android signing tools (no certificates or passwords)
        if: success() || failure()
        run: |
          mkdir -p android-signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-signing-tools/
          tar -czf android-signing-tools.tar.gz android-signing-tools
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-Android-Signing-Tools
          path: android-signing-tools.tar.gz
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: SaudePratica-v1.9.100-UNSIGNED
          path: build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

