name: SaudePratica v1.9.70 Android Build
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/mediagenda-v1969.yml"
      - "MediAgenda/v87_overrides/**"
      - "MediAgenda/v88_overrides/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/mediagenda-v1969.yml"
      - "MediAgenda/v87_overrides/**"
      - "MediAgenda/v88_overrides/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Reconstruct previous versions and apply v1.9.70
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess,yaml
          workflow=yaml.safe_load(open(".github/workflows/mediagenda-build.yml"))
          steps=workflow["jobs"]["build"]["steps"]
          started=False
          for step in steps:
              name=step.get("name","")
              if name=="Reconstruct MediAgenda base":started=True
              if not started:continue
              if name=="Flag missing artwork in intermediate APK":break
              script=step.get("run")
              if script:
                  print("Applying:",name,flush=True)
                  subprocess.run(["bash","-eo","pipefail","-c",script],check=True)
          subprocess.run(["python3","MediAgenda/v87_overrides/apply_v87.py"],check=True)
          PY
      - name: Compile Android 1.9.69
        working-directory: build-src/MediAgenda_Android_v1
        run: gradle --no-daemon assembleRelease
      - name: Check output version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk | head -n 3
          grep -F 'versionName = "1.9.70"' build-src/MediAgenda_Android_v1/app/build.gradle.kts
      - name: Sign release APK with existing key when available
        env:
          KEY_B64: ${{ secrets.SAUDEPRATICA_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.SAUDEPRATICA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAUDEPRATICA_KEY_ALIAS }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "No signing key available; signed APK will not be published."
            exit 0
          fi
          if ! python3 MediAgenda/tools/verify_graphics.py; then
            echo "Original graphics missing; refusing to publish a signed APK."
            exit 0
          fi
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/saudepratica.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/saudepratica.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_PASS --key-pass env:KEY_PASS \
            --out SaudePratica-v1.9.70-SIGNED.apk \
            build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose SaudePratica-v1.9.70-SIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-v1.9.70-SIGNED
          path: SaudePratica-v1.9.70-SIGNED.apk
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-v1.9.70-FULL-SOURCE
          path: build-src/MediAgenda_Android_v1/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-v1.9.70-UNSIGNED
          path: build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
