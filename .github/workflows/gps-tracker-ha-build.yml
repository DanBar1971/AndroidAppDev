name: GPS Tracker HA - Build APK
on:
  push:
    branches: [gps-tracker-ha-apk]
    paths-ignore:
      - 'downloadable/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gps-tracker-ha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Tracker-HA-Android-APK
          path: gps-tracker-ha/app/build/outputs/apk/debug/*.apk
      - name: Make APK directly downloadable from this branch
        run: |
          mkdir -p ../downloadable
          cp app/build/outputs/apk/debug/app-debug.apk ../downloadable/GPS-Tracker-HA-v1.2.0.apk
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloadable/GPS-Tracker-HA-v1.2.0.apk
          git diff --cached --quiet || (git commit -m 'Publish GPS Tracker HA debug APK [skip ci]' && git push)
