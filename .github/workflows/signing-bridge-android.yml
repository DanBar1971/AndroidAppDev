name: Assinar APK SaúdePrática com certificado original (ponte entre repositórios)
on:
  push:
    branches: ["bridge/signature"]
    paths: ["MediAgenda/signing-requests/v19129.txt"]
permissions:
  contents: read
  actions: read
jobs:
  sign-original:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android signature validator
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
          python3 -m pip install --quiet 'cryptography>=42,<50'
      - name: Download verified unsigned Android 1.9.129 from NEW repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "DanBar1971/AndroidAppDev"
          RUN="$(tr -d '[:space:]' < MediAgenda/signing-requests/v19129.txt)"
          [[ "$RUN" =~ ^[0-9]{8,14}$ ]] || { echo "::error::Invalid source workflow id"; exit 1; }
          mkdir -p unsigned
          gh run download "$RUN" --repo DanBar1971/SaudePratica \
            --name SaudePratica-v1.9.129-UNSIGNED --dir unsigned
          test "$(find unsigned -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1
          APK="$(find unsigned -maxdepth 1 -name '*.apk' -type f | head -n1)"
          mkdir -p build-src/MediAgenda_Android_v1/app/build/outputs/apk/release
          cp "$APK" build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          cp MediAgenda/signing-requests/v19129.txt source-run.txt
      - name: Verify exact app identity and version BEFORE accessing signing key
        run: |
          set -euo pipefail
          APK=build-src/MediAgenda_Android_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          META="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | sed -n '1p')"
          echo "$META" | grep -F "name='com.mediagenda.app.stable'"
          echo "$META" | grep -F "versionCode='139'"
          echo "$META" | grep -F "versionName='1.9.129'"
          sha256sum "$APK" | cut -d' ' -f1 > unsigned-sha256.txt
      - name: Recover ORIGINAL private key only in ephemeral runner, sign and verify
        env:
          SAUDEPRACTICA_SIGNING_RECOVERY_HEX: ${{ secrets.SAUDEPRACTICA_SIGNING_RECOVERY_HEX }}
        run: |
          set -euo pipefail
          test -n "$SAUDEPRACTICA_SIGNING_RECOVERY_HEX" || { echo "::error::Original key recovery secret is missing"; exit 1; }
          python3 MediAgenda/tools/sign_release.py
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SaudePratica.apk |
            grep -Fi '7f67082f5e0de76986a0078d5f998e65467c8468f4d09b0caf8e4b332cc60e6a'
          sha256sum SaudePratica.apk > SHA256SUMS.txt
          echo "::notice title=Original signature confirmed::Android 1.9.129 has original certificate. Private material never uploaded."
      - uses: actions/upload-artifact@v4
        with:
          name: SaudePratica-v1.9.129-ORIGINAL-SIGNED
          path: |
            SaudePratica.apk
            SHA256SUMS.txt
            source-run.txt
            unsigned-sha256.txt
          if-no-files-found: error
          retention-days: 14
