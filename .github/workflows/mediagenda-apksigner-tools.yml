name: MediAgenda APK Signer Tools

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/mediagenda-apksigner-tools.yml"

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Install Android SDK build-tools
        uses: android-actions/setup-android@v3
      - name: Install build-tools 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
      - name: Package apksigner
        shell: bash
        run: |
          mkdir -p apksigner-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" apksigner-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner-tools/
          chmod +x apksigner-tools/apksigner
          tar -czf apksigner-tools.tar.gz apksigner-tools
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apksigner-tools-35
          path: apksigner-tools.tar.gz
          retention-days: 7
