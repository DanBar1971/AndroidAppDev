name: MediAgenda Packaging Tools

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/mediagenda-packaging-tools.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Zipalign from Android SDK
        run: |
          mkdir -p tools
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" tools/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" tools/aapt2
          cp /usr/lib/x86_64-linux-gnu/libc++.so.1 tools/libc++.so
          chmod +x tools/zipalign tools/aapt2
          LD_LIBRARY_PATH="$PWD/tools" tools/zipalign -h >/dev/null 2>&1 || true
          tar -czf android-packaging-tools.tar.gz tools
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: MediAgenda-Android-Zipalign
          path: android-packaging-tools.tar.gz
          retention-days: 5
